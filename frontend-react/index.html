<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Website Title -->
    <title>LokArt | Rural Marketplace</title>

    <!-- SEO -->
    <meta
      name="description"
      content="LokArt is a modern rural marketplace empowering local artisans, handmade products, village services, and small entrepreneurs across India."
    />

    <meta
      name="keywords"
      content="LokArt, Rural Marketplace, Handmade Products, Local Artisans, Tailor, Mehndi Artist, Painter, Home Decor, Handicrafts, Village Services, India"
    />

    <meta name="author" content="LokArt Team" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LokArt | Rural Marketplace" />
    <meta
      property="og:description"
      content="Buy handmade products and hire local artisans through LokArt."
    />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:site_name" content="LokArt" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LokArt | Rural Marketplace" />
    <meta
      name="twitter:description"
      content="India's Rural Marketplace for Handmade Products & Local Services."
    />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <noscript>
      Please enable JavaScript to run this application.
    </noscript>

    <div id="root"></div>

    <!-- Razorpay -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- React -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
